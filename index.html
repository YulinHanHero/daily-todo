<!DOCTYPE html>

<title>学习清单 v7</title>
<style>
  /* ================= 主题变量 ================= */
  :root {
    --bg: #f2f4f8;
    --surface: #fff;
    --surface-2: #fafbfc;
    --surface-3: #f6f8fb;
    --text: #1f2329;
    --text-2: #4a5058;
    --muted: #8a919f;
    --muted-2: #a6adb8;
    --muted-3: #c5cad3;
    --border: #e3e6eb;
    --border-2: #ecedf1;
    --primary: #4f7cff;
    --primary-soft: #eef3ff;
    --danger: #e5484d;
    --danger-soft: #fdf0f0;
    --success: #16a34a;
    --success-soft: #eaf7ef;
    --purple: #7a5cff;
    --purple-soft: #f0ebff;
    --warn: #ea8600;
    --warn-soft: #fff3e0;
    --shadow: 0 2px 8px rgba(31, 45, 90, .05);
    --shadow-card: 0 8px 30px rgba(31, 45, 90, .08);
    --shadow-lg: 0 12px 40px rgba(31, 45, 90, .2);
    --mask: rgba(17, 20, 26, .45);
    --on-primary: #fff;
  }
  body.dark {
    --bg: #101319;
    --surface: #1b1f27;
    --surface-2: #22262f;
    --surface-3: #272b35;
    --text: #e9ecf1;
    --text-2: #c3c9d3;
    --muted: #98a0ad;
    --muted-2: #79808c;
    --muted-3: #5a606b;
    --border: #303641;
    --border-2: #282d37;
    --primary: #6f95ff;
    --primary-soft: #23304d;
    --danger: #ff7075;
    --danger-soft: #3b2427;
    --success: #4ade80;
    --success-soft: #1d3327;
    --purple: #a78bff;
    --purple-soft: #2b2546;
    --warn: #f5a742;
    --warn-soft: #3a2e1c;
    --shadow: 0 2px 8px rgba(0, 0, 0, .32);
    --shadow-card: 0 8px 30px rgba(0, 0, 0, .42);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, .55);
    --mask: rgba(0, 0, 0, .62);
    --on-primary: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    transition: background .2s, color .2s;
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(31, 35, 41, .92); color: #fff;
    padding: 10px 18px; border-radius: 10px; font-size: 14px;
    max-width: 86vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999;
  }
  #toast.show { opacity: 1; }

  /* ---------- 登录页 ---------- */
  #authView { min-height: 100%; display: none; align-items: center; justify-content: center; padding: 24px; }
  #authView.active { display: flex; }
  .auth-card {
    background: var(--surface); border-radius: 20px; padding: 36px 24px 28px;
    width: 100%; max-width: 380px; box-shadow: var(--shadow-card);
    text-align: center;
  }
  .brand-icon { line-height: 1; display: flex; justify-content: center; }
  .brand-title { font-size: 24px; font-weight: 700; margin-top: 10px; }
  .brand-sub { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }
  .login-tabs { display: flex; background: var(--surface-3); border-radius: 999px; padding: 3px; margin-bottom: 18px; }
  .login-tabs .ltab {
    flex: 1; border: none; background: none; color: var(--muted);
    font-size: 14px; padding: 8px 0; border-radius: 999px; cursor: pointer;
  }
  .login-tabs .ltab.active { background: var(--surface); color: var(--primary); font-weight: 600; box-shadow: var(--shadow); }
  .login-pane { display: none; }
  .login-pane.active { display: block; }
  .btn-ghost {
    width: 100%; height: 44px; margin-top: 12px; border: none; background: none;
    color: var(--primary); font-size: 14px; cursor: pointer;
  }
  .register-box { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .register-box.show { display: block; }
  .register-box .code-input { margin-top: 8px; }
  .register-box input { margin-top: 8px; }
  .register-box .field .send-btn { height: 48px; padding: 0 14px; }
  .field { display: flex; gap: 8px; }
  .field input { flex: 1; min-width: 0; }
  .send-btn {
    flex: none; padding: 0 14px; border: none; border-radius: 12px;
    background: var(--primary-soft); color: var(--primary); font-size: 14px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .send-btn:disabled { color: var(--muted-2); cursor: default; }
  input[type="tel"], input[type="text"], input[type="password"], input[type="date"] {
    width: 100%; height: 48px; padding: 0 14px;
    border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 16px; outline: none; background: var(--surface-2); color: var(--text);
    transition: border-color .15s, background .15s;
  }
  input:focus { border-color: var(--primary); background: var(--surface); }
  .field-error { color: var(--danger); font-size: 13px; text-align: left; min-height: 20px; margin: 6px 2px 0; }
  .code-input { margin-top: 8px; letter-spacing: 4px; text-align: center; }
  .btn-primary {
    width: 100%; height: 48px; margin-top: 16px;
    border: none; border-radius: 12px; background: var(--primary); color: var(--on-primary);
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: filter .15s;
  }
  .btn-primary:active { filter: brightness(.92); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted-2); font-size: 13px; margin: 22px 0 16px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border-2); }
  .btn-wechat {
    width: 100%; height: 48px; border: none; border-radius: 12px;
    background: #07c160; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn-wechat:disabled { opacity: .55; cursor: default; }
  .login-error { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 14px; word-break: break-all; }

  /* ---------- 应用页 ---------- */
  .app-wrap { max-width: 520px; margin: 0 auto; min-height: 100%; padding-bottom: 40px; }
  .app-header {
    background: linear-gradient(135deg, #4f7cff, #7a5cff);
    color: #fff; padding: 22px 20px 30px;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .app-header h1 { font-size: 22px; font-weight: 700; }
  .today-text { font-size: 13px; opacity: .85; margin-top: 2px; }
  .user-box { display: flex; align-items: center; gap: 8px; }
  .user-name { font-size: 13px; opacity: .9; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
  }
  .icon-btn {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    border: none; background: rgba(255,255,255,.18); color: #fff;
    font-size: 15px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .icon-btn:active { background: rgba(255,255,255,.32); }
  .logout-btn {
    border: none; background: rgba(255,255,255,.16); color: #fff;
    padding: 7px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }
  .header-row.second { margin-top: 14px; }
  .view-tabs { display: flex; background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px; }
  .view-tabs .tab {
    border: none; background: none; color: rgba(255,255,255,.88);
    font-size: 14px; padding: 6px 18px; border-radius: 999px; cursor: pointer;
  }
  .view-tabs .tab.active { background: #fff; color: #4f7cff; font-weight: 600; }

  /* ---------- 导航条 ---------- */
  .nav-card {
    background: var(--surface); margin: -18px 16px 0; border-radius: 16px;
    padding: 10px 12px; box-shadow: var(--shadow-card);
    display: flex; align-items: center; gap: 6px;
  }
  .nav-arrow {
    flex: none; width: 38px; height: 38px; border: none; background: var(--surface-3);
    border-radius: 10px; color: var(--primary); font-size: 22px; line-height: 1; cursor: pointer;
  }
  .nav-arrow:active { background: var(--border-2); }
  .nav-center { flex: 1; min-width: 0; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .range-title { font-size: 15px; font-weight: 600; }
  .today-badge {
    background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 999px;
  }
  .nav-today {
    flex: none; border: none; background: var(--primary-soft); color: var(--primary);
    font-size: 13px; padding: 9px 13px; border-radius: 999px; cursor: pointer; font-weight: 600;
  }

  /* ---------- 添加卡片（居中弹窗） ---------- */
  .add-mask {
    position: fixed; inset: 0; background: var(--mask);
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .add-mask.show { opacity: 1; pointer-events: auto; }
  .add-card {
    position: fixed; left: 50%; top: 50%; z-index: 201;
    background: var(--surface); border-radius: 20px;
    padding: 18px 16px;
    box-shadow: var(--shadow-lg);
    width: calc(100vw - 32px); max-width: 440px; max-height: 86vh; overflow-y: auto;
    transform: translate(-50%, -46%) scale(.96); opacity: 0; pointer-events: none;
    transition: transform .22s cubic-bezier(.4, 0, .2, 1), opacity .22s;
  }
  .add-card.show { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .add-card .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .add-card .sheet-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .add-card .sheet-close {
    border: none; background: var(--surface-3); color: var(--muted); width: 30px; height: 30px;
    border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .add-main { display: flex; flex-direction: column; gap: 10px; }
  .input-row { display: flex; align-items: stretch; gap: 8px; }
  .input-row input { flex: 1 1 0; min-width: 0; width: auto; }
  .opts-row { display: flex; align-items: center; gap: 10px; }
  .opts-row input[type="date"] { height: 36px; font-size: 14px; flex: 1; min-width: 0; }
  .date-label { font-size: 12px; color: var(--muted); flex: none; }
  .repeat-row { display: flex; align-items: center; gap: 8px; }
  .repeat-days { display: flex; flex: 1; min-width: 0; gap: 4px; }
  .repeat-day {
    flex: 1; height: 34px; border: 1.5px solid var(--border); border-radius: 9px;
    background: var(--surface-2); color: var(--muted); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .12s;
  }
  .repeat-day.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .rep-tag {
    flex: none; display: inline-flex; align-items: center; gap: 3px;
    background: var(--purple-soft); color: var(--purple); font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 999px;
  }
  .subj-tag {
    flex: none; display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
  }

  /* ---------- 批量输入 ---------- */
  .batch-toggle {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; font-weight: 500;
  }
  .batch-toggle input[type="checkbox"] {
    width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--primary); cursor: pointer;
  }
  .batch-toggle.on span { color: var(--primary); font-weight: 600; }
  .batch-box { display: none; margin-top: 2px; }
  .batch-box.show { display: block; }
  .batch-box textarea {
    width: 100%; min-height: 96px; padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px;
    font-family: inherit; line-height: 1.6; resize: vertical; outline: none; background: var(--surface-2); color: var(--text);
  }
  .batch-box textarea:focus { border-color: var(--primary); background: var(--surface); }
  .batch-hint { font-size: 11px; color: var(--muted-2); margin: 6px 2px 0; line-height: 1.5; }
  .batch-preview { margin-top: 8px; }
  .batch-preview .bp-item {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2);
    padding: 5px 6px; border-radius: 8px; background: var(--surface-3); margin-bottom: 4px;
  }
  .batch-preview .bp-item .bp-subj { flex: none; }
  .batch-preview .bp-item .bp-title { flex: 1; min-width: 0; word-break: break-all; }
  .add-btn {
    flex: none; border: none; border-radius: 10px; background: var(--primary); color: var(--on-primary);
    padding: 0 20px; height: 36px; font-size: 14px; font-weight: 600; cursor: pointer;
    margin-left: auto;
  }
  .add-btn:active { filter: brightness(.92); }

  /* 浮动加号按钮 */
  .fab {
    position: fixed; right: 22px; bottom: calc(28px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%; border: none; z-index: 150;
    background: var(--primary); color: #fff; font-size: 30px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(79, 124, 255, .4); cursor: pointer;
    transition: transform .15s;
  }
  .fab:active { transform: scale(.92); }

  .counter-row {
    display: flex; justify-content: space-between; align-items: center;
    margin: 14px 20px 10px; font-size: 13px; color: var(--muted);
  }
  .remain-text { color: var(--primary); font-weight: 600; font-size: 14px; }

  .pane { display: none; }
  .pane.active { display: block; }

  /* ---------- 筛选栏 ---------- */
  .filter-bar {
    margin: 12px 16px 0; background: var(--surface); border-radius: 14px;
    padding: 10px 12px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 9px;
  }
  .search-wrap { position: relative; }
  .search-wrap input { height: 38px; padding-left: 32px; font-size: 14px; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted-2); font-size: 13px; pointer-events: none; }
  .chip-line { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chip-line::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1.5px solid var(--border); background: var(--surface-2);
    color: var(--text-2); font-size: 12px; padding: 4px 11px; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .filter-line { display: flex; align-items: center; gap: 8px; }
  .filter-line select {
    flex: 1; min-width: 0; height: 34px; border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--surface-2); color: var(--text-2); font-size: 13px; padding: 0 8px;
    font-family: inherit; outline: none;
  }
  .bulk-switch {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .bulk-switch input { width: 17px; height: 17px; margin: 0; accent-color: var(--primary); cursor: pointer; }
  .bulk-switch.on span { color: var(--primary); font-weight: 600; }

  /* ---------- 批量操作条 ---------- */
  .bulk-bar {
    display: none; margin: 10px 16px 0; background: var(--primary); color: #fff;
    border-radius: 14px; padding: 10px 12px; align-items: center; justify-content: space-between; gap: 8px;
  }
  .bulk-bar.show { display: flex; }
  .bulk-count { font-size: 13px; font-weight: 600; }
  .bulk-acts { display: flex; gap: 8px; }
  .bulk-btn {
    border: none; border-radius: 9px; background: rgba(255, 255, 255, .22); color: #fff;
    font-size: 12px; padding: 6px 11px; cursor: pointer; font-weight: 600;
  }
  .bulk-btn:active { background: rgba(255, 255, 255, .34); }

  /* ---------- 日视图 ---------- */
  #todoList { list-style: none; margin: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .todo-item {
    background: var(--surface); border-radius: 14px; padding: 14px 14px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    box-shadow: var(--shadow);
    animation: slide-in .18s ease-out;
  }
  @keyframes slide-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .todo-item.pri { box-shadow: 0 2px 10px rgba(229, 72, 77, .16); border-left: 3px solid var(--danger); }
  .todo-item.sel { outline: 2px solid var(--primary); outline-offset: -2px; }
  .todo-item .check { margin-left: 2px; }
  .check {
    flex: none; width: 24px; height: 24px; border: 2px solid var(--muted-3); border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; background: var(--surface); transition: all .15s; font-style: normal;
  }
  .todo-item.done .check, .w-item.done .check { background: var(--primary); border-color: var(--primary); }
  .todo-title { flex: 1; min-width: 0; word-break: break-all; font-size: 15.5px; cursor: pointer; }
  .todo-item.done .todo-title { color: var(--muted-2); text-decoration: line-through; }
  .star-btn {
    flex: none; border: none; background: none; font-size: 17px; line-height: 1;
    cursor: pointer; color: var(--muted-3); padding: 0 2px;
  }
  .star-btn.on { color: var(--warn); }
  .todo-notes {
    width: 100%; font-size: 12.5px; color: var(--muted); word-break: break-all;
    padding-left: 36px; margin-top: -4px;
  }
  .del-btn {
    flex: none; border: none; background: none; color: var(--muted-3); font-size: 20px;
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; line-height: 1;
  }
  .del-btn:active { color: var(--danger); background: var(--danger-soft); }
  .empty-state { text-align: center; color: var(--muted-2); font-size: 14px; margin: 48px 20px; display: none; }
  .empty-state.show { display: block; }
  .empty-state .empty-icon { font-size: 40px; display: block; margin-bottom: 8px; }

  /* ---------- 周视图 ---------- */
  .week-day {
    background: var(--surface); border-radius: 14px; margin: 0 16px 10px; padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .week-day-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .week-day-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .week-day-title .wd-date { color: var(--muted); font-weight: 400; font-size: 12px; }
  .week-day-title.today { color: var(--primary); }
  .week-day-title .today-badge { font-size: 10px; padding: 1px 7px; }
  .week-day-count { font-size: 12px; color: var(--muted); }
  .week-day-count .pending { color: var(--primary); font-weight: 600; }
  .week-items { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .w-item { display: flex; align-items: center; gap: 10px; }
  .w-item .check { width: 20px; height: 20px; font-size: 11px; }
  .w-item .w-title { flex: 1; min-width: 0; font-size: 14.5px; word-break: break-all; cursor: pointer; }
  .w-item.done .w-title { color: var(--muted-2); text-decoration: line-through; }
  .w-item .star-btn { font-size: 14px; }
  .w-item .del-btn { font-size: 17px; width: 28px; height: 28px; }
  .w-item.pri .w-title { font-weight: 600; }
  .week-empty { font-size: 13px; color: var(--muted-3); padding: 4px 0 2px; }

  /* ---------- 月视图 ---------- */
  .month-card {
    background: var(--surface); margin: 0 16px; border-radius: 16px; padding: 12px 8px 8px;
    box-shadow: var(--shadow);
  }
  .month-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); }
  .month-weekdays span { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0 8px; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .month-cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5px 0 4px; border-radius: 10px; cursor: pointer; min-height: 52px;
  }
  .month-cell:active { background: var(--surface-3); }
  .month-cell.dim { opacity: .32; }
  .m-day { font-size: 14px; }
  .month-cell.today .m-day {
    background: var(--primary); color: #fff; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600;
  }
  .m-badge {
    margin-top: 3px; min-width: 16px; height: 16px; padding: 0 5px;

/* ================= 日期工具 ================= */
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()) }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n) }
function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1) }
function startOfWeek(d) { var wd = (d.getDay() + 6) % 7; return addDays(d, -wd) }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1) }
function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0) }
function fmtDate(d) {
  var m = d.getMonth() + 1, day = d.getDate()
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day)
}
function isToday(d) { return fmtDate(d) === fmtDate(startOfDay(new Date())) }
function parseDate(s) {
  var p = String(s).split('-')
  return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10))
}
function jsDowToIso(dow) { return dow === 0 ? 7 : dow }
function isoDowToJs(iso) { return iso === 7 ? 0 : iso }

function rangeFor(mode, c) {
  if (mode === 'day') return { start: startOfDay(c), end: startOfDay(c) }
  if (mode === 'week') { var s = startOfWeek(c); return { start: s, end: addDays(s, 6) } }
  return { start: startOfMonth(c), end: endOfMonth(c) }
}

/* ================= 错误信息 ================= */
function friendlyError(error) {
  if (error && error.code === '42P01') return '数据表尚未就绪，请稍后重试'
  if (error && error.code === '42501') return '没有权限执行此操作，请退出后重新登录'
  if (error && error.kind === 'unauthenticated') return '登录已过期，请重新登录'
  if (error && error.code === '23505') return '该名称已存在，换一个试试'
  var msg = error && error.message ? String(error.message) : ''
  if (/password not set/i.test(msg)) return '该手机号还没设置过密码，请切换到「验证码登录」进入后即可正常使用'
  if (/invalid credentials|wrong password|incorrect/i.test(msg)) return '手机号或密码不正确'
  if (msg) return msg
  return '网络异常，请稍后重试'
}

/* ================= 启动：OAuth 回调分发 + 会话恢复 ================= */
async function restoreAuth() {
  var url = new URL(location.href)
  if (!url.searchParams.has('code') && !url.searchParams.has('error')) {
    await continueNormalStartup()
    return
  }
  var provider = url.searchParams.get('provider')
  if (provider !== 'wechat') {
    var errDesc = url.searchParams.get('error_description') || url.searchParams.get('error')
    showLoginError(errDesc ? ('登录失败：' + errDesc) : '授权回调缺少有效的登录方式，请重新登录。')
    return
  }
  var handleCallback = cloud.auth.handleWechatWebCallback
  if (typeof handleCallback !== 'function') {
    showLoginError('暂时无法使用此方式登录，请联系应用管理员。')
    return
  }
  var res = await handleCallback.call(cloud.auth)
  if (res.error) {
    showLoginError(friendlyError(res.error))
  } else if (res.data) {
    for (var key of ['code', 'state', 'provider']) url.searchParams.delete(key)
    history.replaceState(null, '', url.pathname + url.search + url.hash)
    await enterApp(res.data)
  } else {
    await continueNormalStartup()
  }
}

async function continueNormalStartup() {
  var res = await cloud.auth.getSession()
  if (res.error) {
    showLoginView()
    showToast('网络异常，未能恢复登录状态，请刷新重试')
    return
  }
  if (!res.data) { showLoginView(); return }
  await enterApp(res.data)
}

  }
  if (!code) { regError.textContent = '请输入验证码'; return }
  var isExisting = regPendingOtp.isExistingUser
  if (!isExisting && (!pwd || pwd.length < 6)) { regError.textContent = '请设置至少 6 位密码'; return }
  registerBtn.disabled = true
  registerBtn.textContent = isExisting ? '登录中…' : '注册中…'
  var completed = await cloud.auth.verifyOtp({
    phone: phone,
    verificationId: regPendingOtp.verificationId,
    isExistingUser: isExisting,
    token: code,
    password: isExisting ? undefined : pwd
  })
  registerBtn.disabled = false
  registerBtn.textContent = '注册并登录'
  if (completed.error) {
    regError.textContent = friendlyError(completed.error)
    return
  }
  regPendingOtp = null
  setRegisterMode(false)
  pwdInput.value = ''
  await enterApp(completed.data)
})

function todoMatchesDay(t, day) {
  var key = fmtDate(day)
  var dueKey = String(t.due_date || '').slice(0, 10)
  if (dueKey === key) return true
  var rp = t.repeat_days
  if (Array.isArray(rp) && rp.length > 0) {
    var iso = jsDowToIso(day.getDay())
    if (rp.indexOf(iso) !== -1) return true
  }
  return false
}

/* 把全部待办按日期范围展开成实例（重复任务会出现在多个日期） */
function expandBetween(start, end) {
  var list = []
  allTodos.forEach(function (t) {
    var rp = t.repeat_days
    var isRepeat = Array.isArray(rp) && rp.length > 0
    if (!isRepeat) {
      var dueKey = String(t.due_date || '').slice(0, 10)
      if (dueKey >= fmtDate(start) && dueKey <= fmtDate(end)) {
        list.push(makeInstance(t, dueKey, false))
      }
      return
    }
    var startKey = String(t.due_date || '').slice(0, 10)
    var endKey = String(t.repeat_end || '').slice(0, 10)
    var beginStr = startKey > fmtDate(start) ? startKey : fmtDate(start)
    var endStr = endKey && endKey < fmtDate(end) ? endKey : fmtDate(end)
    var beginDate = parseDate(beginStr)
    var endDate = parseDate(endStr)
    var days = Math.round((endDate - beginDate) / 86400000)
    if (days < 0) days = 0
    for (var i = 0; i <= days; i++) {
      var d = addDays(beginDate, i)
      var iso = jsDowToIso(d.getDay())
      if (rp.indexOf(iso) !== -1) {
        list.push(makeInstance(t, fmtDate(d), true))
      }
    }
  })
  list.sort(function (a, b) {
    if (a.due_date < b.due_date) return -1
    if (a.due_date > b.due_date) return 1
    return 0
  })
  return list
}

function makeInstance(t, dateKey, isRepeat) {
  return {
    id: t.id,
    title: t.title,
    done: t.done,
    due_date: dateKey,
    repeat_days: t.repeat_days,
    isRepeat: isRepeat,
    subject: t.subject,
    priority: !!t.priority,
    notes: t.notes || '',
    created_at: t.created_at
  }
}

function expandRange() {
  var r = rangeFor(viewMode === 'stats' ? 'month' : viewMode, cursor)
  rangeTodos = expandBetween(r.start, r.end)
}

/* ================= 筛选 / 排序 ================= */
function applyFilter(list) {
  var kw = searchKeyword.trim().toLowerCase()
  var out = list.filter(function (t) {
    if (filterSubject !== 'all' && (t.subject || 'qita') !== filterSubject) return false
    if (kw) {
      var hay = (t.title || '').toLowerCase() + ' ' + (t.notes || '').toLowerCase()
      if (hay.indexOf(kw) === -1) return false
    }
    return true
  })
  out.sort(function (a, b) {
    if (sortMode === 'priority') {
      if (a.priority !== b.priority) return a.priority ? -1 : 1
    }
    if (sortMode === 'due') {
      if (a.due_date !== b.due_date) return a.due_date < b.due_date ? -1 : 1
    }
    if (sortMode === 'created') {
      var ca = a.created_at || '', cb = b.created_at || ''
      if (ca !== cb) return ca < cb ? 1 : -1
    }
    if (sortMode === 'title') {
      return (a.title || '').localeCompare(b.title || '', 'zh-Hans-CN')
    }
    if (a.due_date !== b.due_date) return a.due_date < b.due_date ? -1 : 1
    return 0
  })
  return out
}

/* ---------- 批量：科目识别 + 编号拆分 ---------- */
function matchSubject(prefix) {
  prefix = prefix.replace(/^\s+/, '')
  var reg = subjectRegistry()
  for (var i = 0; i < reg.length; i++) {
    var names = [reg[i].name]
    if (reg[i].builtin) {
      var extra = { yuwen: ['语'], shuxue: ['数'], yingyu: ['英'], kexue: ['科'], qita: ['其它'] }
      if (extra[reg[i].key]) names = names.concat(extra[reg[i].key])
    }
    for (var j = 0; j < names.length; j++) {
      var n = names[j]
      if (prefix.indexOf(n) === 0) {
        var rest = prefix.slice(n.length)
        if (rest === '' || /^[\s:：、,，]/.test(rest)) return reg[i]
      }
    }
  }
  return null
}

function parseBatch(text) {
  text = (text || '').replace(/\r\n/g, '\n')
  var results = []
  var curSubject = null
  var lines = text.split('\n')
  lines.forEach(function (line) {
    var trimmed = line.trim()
    if (!trimmed) return
    var subj = matchSubject(trimmed)
    if (subj) {
      curSubject = subj.key
      trimmed = stripSubjectPrefix(trimmed)
      if (!trimmed) return
    }
    var items = splitNumbered(trimmed)
    items.forEach(function (it) {
      if (!it) return
      results.push({ subject: curSubject || 'qita', title: it })
    })
  })
  return results
}

function stripSubjectPrefix(s) {
  var reg = subjectRegistry()
  for (var i = 0; i < reg.length; i++) {
    var names = [reg[i].name]
    if (reg[i].builtin) {
      var extra = { yuwen: ['语'], shuxue: ['数'], yingyu: ['英'], kexue: ['科'], qita: ['其它'] }
      if (extra[reg[i].key]) names = names.concat(extra[reg[i].key])
    }
    for (var j = 0; j < names.length; j++) {
      var n = names[j]
      if (s.indexOf(n) === 0) {
        var rest = s.slice(n.length)
        if (rest === '' || /^[\s:：、,，]/.test(rest)) {
          return rest.replace(/^[\s:：、,，]+/, '')
        }
      }
    }
  }
  return s
}

function splitNumbered(s) {
  var parts = []
  var re = /(?:^|[\s,，;；])(?:\(\s*)?(\d{1,2})(?:\s*\))?\s*[.、．:：)]/g
  var last = 0
  var m
  var found = false
  while ((m = re.exec(s)) !== null) {
    found = true
    if (last < m.index) {
      var pre = s.slice(last, m.index).trim()
      if (pre) parts.push(pre)
    }
    last = re.lastIndex
  }
  if (last < s.length) {
    var tail = s.slice(last).trim()
    if (tail) parts.push(tail)
  }
  if (!found) {
    var whole = s.trim()
    if (whole) return [whole]
    return []
  }
  return parts.map(function (p) {
    return p.replace(/^\s*(?:\(\s*)?\d{1,2}(?:\s*\))?\s*[.、．:：)]\s*/, '').trim()
  }).filter(function (p) { return p })
}

        if (payload.repeat_days !== undefined) allTodos[i].repeat_days = payload.repeat_days
      }
      break
    }
  }
  closeDetail()
  expandRange()
  render()
  showToast('已保存')
})

dDeleteBtn.addEventListener('click', async function () {
  if (editingId === null) return
  var id = editingId
  var rec = findTodoById(id)
  closeDetail()
  await deleteTodo(id, rec)
})

/* ================= 完成 / 删除 ================= */
function findTodo(id) {
  for (var i = 0; i < rangeTodos.length; i++) { if (String(rangeTodos[i].id) === String(id)) return rangeTodos[i] }
  return null
}

async function toggleTodo(id) {
  var item = findTodo(id)
  if (!item) return
  var next = !item.done
  var res = await cloud.database.from('todos').update({ done: next }).eq('id', numId(id)).select()
  if (res.error) { showToast(friendlyError(res.error)); return }
  var affected = Array.isArray(res.data) ? res.data : []
  if (affected.length === 0) { showToast('修改失败，该待办可能已不存在'); return }
  for (var i = 0; i < allTodos.length; i++) {
    if (String(allTodos[i].id) === String(id)) { allTodos[i].done = next; break }
  }
  expandRange()
  render()
}

async function togglePriority(id) {
  var t = findTodoById(id)
  if (!t) return
  var next = !t.priority
  var res = await cloud.database.from('todos').update({ priority: next }).eq('id', numId(id)).select()
  if (res.error) { showToast(friendlyError(res.error)); return }
  var affected = Array.isArray(res.data) ? res.data : []
  if (affected.length === 0) { showToast('修改失败，该待办可能已不存在'); return }
  for (var i = 0; i < allTodos.length; i++) {
    if (String(allTodos[i].id) === String(id)) { allTodos[i].priority = next; break }
  }
  expandRange()
  render()
}

async function deleteTodo(id, record) {
  var res = await cloud.database.from('todos').delete().eq('id', numId(id)).select()
  if (res.error) { showToast(friendlyError(res.error)); return }
  var removed = Array.isArray(res.data) ? res.data : []
  if (removed.length === 0) { showToast('删除失败，该待办可能已不存在'); return }
  var gone = removed[0] || record
  allTodos = allTodos.filter(function (t) { return String(t.id) !== String(id) })
  delete selectedIds[id]
  expandRange()
  render()
  showUndo(gone)
}

/* ---------- 撤销删除 ---------- */
function showUndo(record) {
  if (!record) return
  undoRecord = record
  clearTimeout(undoTimer)
  if (!undoBar) {
    undoBar = document.createElement('div')
    undoBar.className = 'bulk-bar show'
    undoBar.style.position = 'fixed'
    undoBar.style.left = '16px'
    undoBar.style.right = '16px'
    undoBar.style.bottom = 'calc(92px + env(safe-area-inset-bottom))'
    undoBar.style.margin = '0'
    undoBar.style.zIndex = '160'
    undoBar.innerHTML = '<span class="bulk-count">已删除 1 项</span><div class="bulk-acts"><button type="button" class="bulk-btn" id="undoBtn">撤销</button></div>'
    document.body.appendChild(undoBar)
    undoBar.querySelector('#undoBtn').addEventListener('click', undoDelete)
  }
  undoBar.classList.add('show')
  undoTimer = setTimeout(hideUndo, 6000)
}
function hideUndo() {
  if (undoBar) undoBar.classList.remove('show')
  undoRecord = null
}
async function undoDelete() {
  if (!undoRecord) return
  var rec = undoRecord
  var payload = {
    title: rec.title,
    due_date: String(rec.due_date || '').slice(0, 10),
    done: !!rec.done,
    priority: !!rec.priority,
    notes: rec.notes || '',
    subject: rec.subject || null
  }
  if (Array.isArray(rec.repeat_days) && rec.repeat_days.length > 0) {
    payload.repeat_days = rec.repeat_days
    payload.repeat_end = rec.repeat_end || null
  }
  var res = await cloud.database.from('todos').insert(payload).select()
  if (res.error) { showToast(friendlyError(res.error)); return }
  var created = Array.isArray(res.data) && res.data[0]
  if (created) allTodos.push(created)
  hideUndo()
  expandRange()
  render()
  showToast('已撤销删除')
}

$('bulkDoneBtn').addEventListener('click', async function () {
  var ids = Object.keys(selectedIds)
  if (ids.length === 0) { showToast('请先选择要操作的任务'); return }
  /* id 在数据库里是 bigint，统一转成数字，避免 .in() 类型不匹配 */
  var idNums = ids.map(function (v) { return Number(v) }).filter(function (n) { return !isNaN(n) })
  if (idNums.length === 0) { showToast('请先选择要操作的任务'); return }
  var res = await cloud.database.from('todos').update({ done: true }).in('id', idNums).select()
  if (res.error) { showToast(friendlyError(res.error)); return }
  var affected = Array.isArray(res.data) ? res.data : []
  affected.forEach(function (row) {
    for (var i = 0; i < allTodos.length; i++) {
      if (String(allTodos[i].id) === String(row.id)) { allTodos[i].done = true; break }
    }
  })
  selectedIds = {}
  renderBulkBar()
  expandRange()
  render()
  showToast('已标记完成 ' + affected.length + ' 项')
})
$('bulkDelBtn').addEventListener('click', async function () {
  var ids = Object.keys(selectedIds)
  if (ids.length === 0) { showToast('请先选择要操作的任务'); return }
  var removedRows = []
  for (var i = 0; i < ids.length; i++) {
    var res = await cloud.database.from('todos').delete().eq('id', Number(ids[i])).select()
    if (res.error) { showToast(friendlyError(res.error)); return }
    var removed = Array.isArray(res.data) ? res.data : []
    if (removed.length === 0) continue
    removedRows.push(removed[0])
    allTodos = allTodos.filter(function (t) { return String(t.id) !== String(ids[i]) })
  }
  selectedIds = {}
  bulkMode = false
  bulkToggle.checked = false
  bulkSwitchWrap.classList.remove('on')
  renderBulkBar()
  expandRange()
  render()
  showToast('已删除 ' + removedRows.length + ' 项')
})

/* ---------- 统计视图 ---------- */
function computeStats() {
  var monthStart = startOfMonth(cursor)
  var monthEnd = endOfMonth(cursor)
  var monthItems = expandBetween(monthStart, monthEnd)
  var monthDone = monthItems.filter(function (t) { return t.done }).length
  var monthTotal = monthItems.length

  /* 连续打卡：当天有任务且全部完成则算打卡 */
  var today = startOfDay(new Date())
  var streak = 0
  var probe = new Date(today)
  var todayItems = expandBetween(probe, probe)
  if (!(todayItems.length > 0 && todayItems.every(function (t) { return t.done }))) {
    probe = addDays(probe, -1)
  }
  for (var guard = 0; guard < 400; guard++) {
    var items = expandBetween(probe, probe)
    if (items.length > 0 && items.every(function (t) { return t.done })) {
      streak++
      probe = addDays(probe, -1)
    } else {
      break
    }
  }

  /* 近 7 天 */
  var last7 = []
  for (var i = 6; i >= 0; i--) {
    var d = addDays(today, -i)
    var its = expandBetween(d, d)
    last7.push({
      date: d,
      total: its.length,
      done: its.filter(function (t) { return t.done }).length
    })
  }

  /* 科目分布 */
  var bySubject = {}
  monthItems.forEach(function (t) {
    var k = t.subject || 'qita'
    if (!bySubject[k]) bySubject[k] = { total: 0, done: 0 }
    bySubject[k].total++
    if (t.done) bySubject[k].done++
  })

  return {
    monthTotal: monthTotal,
    monthDone: monthDone,
    monthRate: monthTotal ? Math.round(monthDone * 100 / monthTotal) : 0,
    streak: streak,
    last7: last7,
    bySubject: bySubject
  }
}

  card1.appendChild(streakLine)

  /* 近 7 天 */
  var card2 = document.createElement('div')

  var maxV = 1
  s.last7.forEach(function (d) { if (d.total > maxV) maxV = d.total })
  var spark = document.createElement('div')
  spark.className = 'spark'
  s.last7.forEach(function (d) {

    var inner = document.createElement('i')

    x.className = 'spark-x'
    x.textContent = (d.date.getMonth() + 1) + '/' + d.date.getDate()
    col.appendChild(barWrap)
    col.appendChild(x)
    spark.appendChild(col)
  })
  card2.appendChild(spark)
  var note2 = document.createElement('p')
  note2.className = 'stat-note'
  note2.textContent = '柱子高度 = 当天已完成数量（浅色部分为当天任务总量）'
  card2.appendChild(note2)
  statsWrap.appendChild(card2)

  /* 科目分布 */
  var card3 = document.createElement('div')
  card3.className = 'stat-card'
  card3.innerHTML = '<div class="stat-title">各科目任务量（本月）</div>'
  var keys = Object.keys(s.bySubject)
  if (keys.length === 0) {
    var em = document.createElement('div')
    em.className = 'stat-empty'
    em.textContent = '本月还没有任务'
    card3.appendChild(em)
  } else {
    var maxT = 1
    keys.forEach(function (k) { if (s.bySubject[k].total > maxT) maxT = s.bySubject[k].total })
    keys.sort(function (a, b) { return s.bySubject[b].total - s.bySubject[a].total })
    keys.forEach(function (k) {
      var v = s.bySubject[k]
      var row = document.createElement('div')

      var fill = document.createElement('span')
      fill.className = 'bar-fill'
      fill.style.width = Math.round(v.total * 100 / maxT) + '%'
      fill.style.background = subjectColor(k)
      track.appendChild(fill)
      var val = document.createElement('span')
      val.className = 'bar-val'
      val.textContent = v.done + '/' + v.total
      row.appendChild(label)
      row.appendChild(track)
      row.appendChild(val)
      card3.appendChild(row)
    })
  }
  statsWrap.appendChild(card3)
}

/* ---------- 计数 ---------- */
function renderCounter() {
  var list = applyFilter(rangeTodos)
  var total = list.length
  var done = 0
  list.forEach(function (t) { if (t.done) done++ })
  var remain = total - done
  if (viewMode === 'day') {
    remainText.textContent = '还剩 ' + remain + ' 项待办'
  } else if (viewMode === 'week') {
    remainText.textContent = '本周还剩 ' + remain + ' 项待办'
  } else if (viewMode === 'month') {
    remainText.textContent = '本月还剩 ' + remain + ' 项待办'
  } else {
    remainText.textContent = '本月还剩 ' + remain + ' 项待办'
  }
  doneText.textContent = '已完成 ' + done + ' / ' + total
}

/* ================= 日期显示 & 启动 ================= */
(function initToday() {
  var d = new Date()
  $('todayText').textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + WEEK_CN[d.getDay()]
  var dark = false
  try { dark = localStorage.getItem(THEME_KEY) === 'dark' } catch (e) {}
  document.body.classList.toggle('dark', dark)
  themeBtn.textContent = dark ? '☀️' : '🌙'
})()

if (cloud) restoreAuth()

</script>
